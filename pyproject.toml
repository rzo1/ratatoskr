[project]
name = "ratatoskr"
version = "0.1.0"
description = "Ratatoskr, the squirrel running up and down Yggdrasil: carries your repos from an SSO-protected GitLab to another GitLab"
readme = "README.md"
authors = [
    { name = "Richard Zowalla", email = "rzo1@apache.org" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.45",
    "requests>=2.32.0",
]

[project.scripts]
ratatoskr = "ratatoskr.cli:main"
glm = "ratatoskr.cli:main"  # "gitlab migrate"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
